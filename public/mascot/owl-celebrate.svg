<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 196" role="img" aria-label="The History Optional owl, celebrating">
  <style>
    .bob { animation: bob 1.6s ease-in-out infinite; transform-origin: 100px 170px; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .conf { animation: twinkle 1.8s ease-in-out infinite; }
    .conf.b { animation-delay: .6s; } .conf.c { animation-delay: 1.2s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .bob, .conf { animation: none; } }
  </style>
  <defs>
    <g id="csil">
      <path d="M64 70 L56 40 Q76 50 86 58 Q100 54 114 58 Q124 50 144 40 L136 70 Q150 90 148 120 Q144 156 116 170 Q100 176 84 170 Q56 156 52 120 Q50 90 64 70 Z"/>
      <path d="M60 124 Q36 118 22 94 Q18 84 24 78 Q30 88 36 90 Q34 78 41 73 Q46 85 52 88 Q53 78 60 76 Q62 98 70 112 Z"/>
      <path d="M140 124 Q164 118 178 94 Q182 84 176 78 Q170 88 164 90 Q166 78 159 73 Q154 85 148 88 Q147 78 140 76 Q138 98 130 112 Z"/>
      <circle cx="84" cy="174" r="5"/><circle cx="90" cy="176" r="5"/><circle cx="96" cy="174" r="5"/>
      <circle cx="104" cy="174" r="5"/><circle cx="110" cy="176" r="5"/><circle cx="116" cy="174" r="5"/>
    </g>
  </defs>

  <!-- confetti -->
  <g class="conf">
    <rect x="24" y="22" width="8" height="4" rx="1" fill="#4f6de2" transform="rotate(-25 28 24)"/>
    <circle cx="172" cy="26" r="3.2" fill="#e8b84b"/>
    <rect x="160" y="100" width="8" height="4" rx="1" fill="#f07a6a" transform="rotate(30 164 102)"/>
  </g>
  <g class="conf b">
    <rect x="44" y="8" width="7" height="3.5" rx="1" fill="#f07a6a" transform="rotate(20 47 10)"/>
    <circle cx="186" cy="68" r="2.8" fill="#4f6de2"/>
    <rect x="12" y="92" width="7" height="3.5" rx="1" fill="#e8b84b" transform="rotate(-35 15 94)"/>
  </g>
  <g class="conf c">
    <rect x="150" y="6" width="8" height="4" rx="1" fill="#5ec4a0" transform="rotate(-15 154 8)"/>
    <circle cx="14" cy="56" r="3" fill="#5ec4a0"/>
    <circle cx="98" cy="14" r="2.6" fill="#e8b84b"/>
  </g>
  <g stroke="#f5a524" stroke-width="4" stroke-linecap="round">
    <path d="M100 20 L100 30"/><path d="M78 26 L83 34"/><path d="M122 26 L117 34"/>
  </g>

  <g class="bob">
    <use href="#csil" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round" opacity=".10" transform="translate(0 4)"/>
    <use href="#csil" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>

    <!-- raised wings, behind the body -->
    <path d="M60 124 Q36 118 22 94 Q18 84 24 78 Q30 88 36 90 Q34 78 41 73 Q46 85 52 88 Q53 78 60 76 Q62 98 70 112 Z" fill="#0e0e14"/>
    <g stroke="#2c2c3a" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M32 92 Q44 106 60 114"/><path d="M42 86 Q52 100 64 108"/>
    </g>
    <path d="M140 124 Q164 118 178 94 Q182 84 176 78 Q170 88 164 90 Q166 78 159 73 Q154 85 148 88 Q147 78 140 76 Q138 98 130 112 Z" fill="#0e0e14"/>
    <g stroke="#2c2c3a" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M168 92 Q156 106 140 114"/><path d="M158 86 Q148 100 136 108"/>
    </g>

    <!-- body -->
    <path d="M64 70 L56 40 Q76 50 86 58 Q100 54 114 58 Q124 50 144 40 L136 70 Q150 90 148 120 Q144 156 116 170 Q100 176 84 170 Q56 156 52 120 Q50 90 64 70 Z" fill="#15151c"/>
    <path d="M70 70 Q84 60 100 61" stroke="#3a3a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="140" rx="31" ry="27" fill="#20202b"/>
    <g stroke="#3a3a50" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 128 l4 4 l4 -4"/><path d="M96 128 l4 4 l4 -4"/><path d="M108 128 l4 4 l4 -4"/>
      <path d="M78 140 l4 4 l4 -4"/><path d="M90 140 l4 4 l4 -4"/><path d="M102 140 l4 4 l4 -4"/><path d="M114 140 l4 4 l4 -4"/>
      <path d="M84 152 l4 4 l4 -4"/><path d="M96 152 l4 4 l4 -4"/><path d="M108 152 l4 4 l4 -4"/>
    </g>

    <!-- facial disc -->
    <path d="M100 76 Q86 62 72 68 Q58 76 60 92 Q62 110 80 112 Q92 112 100 104 Q108 112 120 112 Q138 110 140 92 Q142 76 128 68 Q114 62 100 76 Z" fill="#262634"/>

    <!-- wide, delighted eyes, lashes kept -->
    <circle cx="81" cy="91" r="13" fill="#fff"/>
    <circle cx="119" cy="91" r="13" fill="#fff"/>
    <circle cx="81" cy="89" r="9" fill="#4f6de2"/><circle cx="119" cy="89" r="9" fill="#4f6de2"/>
    <circle cx="81" cy="89" r="6" fill="#8aa2f5" opacity=".35"/><circle cx="119" cy="89" r="6" fill="#8aa2f5" opacity=".35"/>
    <circle cx="81" cy="89" r="4.6" fill="#0b0b10"/><circle cx="119" cy="89" r="4.6" fill="#0b0b10"/>
    <circle cx="84" cy="85.5" r="2.4" fill="#fff"/><circle cx="122" cy="85.5" r="2.4" fill="#fff"/>
    <circle cx="78.5" cy="92.5" r="1.2" fill="#fff"/><circle cx="116.5" cy="92.5" r="1.2" fill="#fff"/>
    <path d="M69 84 Q81 74 93 84" stroke="#0b0b10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M107 84 Q119 74 131 84" stroke="#0b0b10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M69.5 84 Q64 83 61 78" stroke="#0b0b10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M130.5 84 Q136 83 139 78" stroke="#0b0b10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="72" cy="106" rx="6" ry="3" fill="#f07a6a" opacity=".55"/>
    <ellipse cx="128" cy="106" rx="6" ry="3" fill="#f07a6a" opacity=".55"/>

    <!-- open beak -->
    <path d="M93 100 L107 100 L100 108 Z" fill="#e8b84b"/>
    <path d="M95 110 L105 110 L100 118 Z" fill="#b8881e"/>
    <path d="M96 108.5 L104 108.5 L100 112 Z" fill="#c2413a"/>

    <!-- feet -->
    <g fill="#e8b84b">
      <circle cx="84" cy="174" r="4.2"/><circle cx="90" cy="176" r="4.2"/><circle cx="96" cy="174" r="4.2"/>
      <circle cx="104" cy="174" r="4.2"/><circle cx="110" cy="176" r="4.2"/><circle cx="116" cy="174" r="4.2"/>
    </g>
  </g>
</svg>
