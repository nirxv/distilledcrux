<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 170" role="img" aria-label="The History Optional owl, peering through a magnifying glass">
  <style>
    .lid { animation: blink 5s infinite; transform-origin: 65px 52px; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(1.9); } }
    .spark { animation: glint 2.4s ease-in-out infinite; transform-origin: 138px 38px; }
    @keyframes glint { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .lid, .spark { animation: none; } }
  </style>
  <defs>
    <clipPath id="eyeL"><circle cx="65" cy="66" r="13"/></clipPath>
    <clipPath id="eyeR"><circle cx="106" cy="66" r="17"/></clipPath>
    <g id="sil">
      <path d="M48 44 L40 14 Q60 24 70 32 Q84 28 98 32 Q108 24 128 14 L120 44 Q134 64 132 94 Q128 130 100 144 Q84 150 68 144 Q40 130 36 94 Q34 64 48 44 Z"/>
      <path d="M42 82 Q28 112 50 140 Q60 120 56 96 Q52 86 42 82 Z"/>
      <path d="M122 88 Q140 84 145 98 Q140 112 124 114 Q116 102 122 88 Z"/>
      <circle cx="106" cy="66" r="25"/>
      <path d="M122 82 L154 106" stroke-width="10" stroke-linecap="round"/>
      <circle cx="68" cy="148" r="5"/><circle cx="74" cy="150" r="5"/><circle cx="80" cy="148" r="5"/>
      <circle cx="90" cy="148" r="5"/><circle cx="96" cy="150" r="5"/><circle cx="102" cy="148" r="5"/>
    </g>
  </defs>

  <!-- sticker edge and a soft drop -->
  <use href="#sil" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round" opacity=".10" transform="translate(0 4)"/>
  <use href="#sil" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>

  <!-- body -->
  <path d="M48 44 L40 14 Q60 24 70 32 Q84 28 98 32 Q108 24 128 14 L120 44 Q134 64 132 94 Q128 130 100 144 Q84 150 68 144 Q40 130 36 94 Q34 64 48 44 Z" fill="#15151c"/>
  <!-- tuft highlights -->
  <path d="M44 20 Q56 27 64 33" stroke="#2c2c3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M124 20 Q112 27 104 33" stroke="#2c2c3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <path d="M54 44 Q68 34 84 35" stroke="#3a3a4e" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".9"/>

  <!-- belly and feathers -->
  <ellipse cx="84" cy="114" rx="31" ry="28" fill="#20202b"/>
  <g stroke="#3a3a50" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 102 l4 4 l4 -4"/><path d="M80 102 l4 4 l4 -4"/><path d="M92 102 l4 4 l4 -4"/>
    <path d="M62 114 l4 4 l4 -4"/><path d="M74 114 l4 4 l4 -4"/><path d="M86 114 l4 4 l4 -4"/><path d="M98 114 l4 4 l4 -4"/>
    <path d="M68 126 l4 4 l4 -4"/><path d="M80 126 l4 4 l4 -4"/><path d="M92 126 l4 4 l4 -4"/>
  </g>

  <!-- facial disc -->
  <path d="M84 50 Q70 36 56 42 Q42 50 44 66 Q46 84 64 86 Q76 86 84 78 Q92 86 104 86 Q122 84 124 66 Q126 50 112 42 Q98 36 84 50 Z" fill="#262634"/>

  <!-- left eye: half-lidded, unbothered -->
  <circle cx="65" cy="66" r="13" fill="#fff"/>
  <g clip-path="url(#eyeL)">
    <circle cx="67" cy="68" r="8.5" fill="#4f6de2"/>
    <circle cx="67" cy="68" r="5.5" fill="#8aa2f5" opacity=".35"/>
    <circle cx="68" cy="68" r="4.5" fill="#0b0b10"/>
    <circle cx="70.5" cy="65" r="2" fill="#fff"/>
    <path class="lid" d="M48 63 Q65 67 82 60 L82 44 L48 44 Z" fill="#262634"/>
  </g>
  <path d="M51.5 62.5 Q65 66.5 79 60.5" stroke="#0b0b10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M52 62 Q47 61 44 56" stroke="#0b0b10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M54.5 64 Q50 64.5 47 61.5" stroke="#0b0b10" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- magnifier handle, gripped by the wing -->
  <path d="M122 82 L154 106" stroke="#e8b84b" stroke-width="8" stroke-linecap="round"/>
  <path d="M143 98 L154 106" stroke="#8a6414" stroke-width="8" stroke-linecap="round"/>
  <path d="M124 81 L141 94" stroke="#fff3cf" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- right eye, magnified -->
  <circle cx="106" cy="66" r="17" fill="#fff"/>
  <g clip-path="url(#eyeR)">
    <circle cx="104" cy="68" r="11.5" fill="#4f6de2"/>
    <circle cx="104" cy="68" r="8" fill="#8aa2f5" opacity=".35"/>
    <circle cx="103" cy="68" r="6.2" fill="#0b0b10"/>
    <circle cx="107" cy="63.5" r="2.8" fill="#fff"/>
    <circle cx="100" cy="72" r="1.3" fill="#fff" opacity=".8"/>
    <path d="M86 55 Q106 49 126 55 L126 36 L86 36 Z" fill="#262634"/>
  </g>
  <path d="M90 54 Q106 49.5 122 54" stroke="#0b0b10" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="106" cy="66" r="22" fill="#8aa2f5" opacity=".16"/>
  <circle cx="106" cy="66" r="22" fill="none" stroke="#e8b84b" stroke-width="5"/>
  <circle cx="106" cy="66" r="24.5" fill="none" stroke="#b8881e" stroke-width="1.2" opacity=".7"/>
  <path d="M92 54 Q97 48 104 47" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>

  <!-- beak, with a slight smirk -->
  <path d="M84 73 L91 80 L86.5 91 L78 80.5 Z" fill="#e8b84b"/>
  <path d="M84 73 L91 80 L86.5 91 Z" fill="#b8881e" opacity=".55"/>

  <!-- wings -->
  <path d="M42 82 Q28 112 50 140 Q60 120 56 96 Q52 86 42 82 Z" fill="#0e0e14"/>
  <path d="M44 96 Q40 112 48 128" stroke="#2c2c3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M122 88 Q140 84 145 98 Q140 112 124 114 Q116 102 122 88 Z" fill="#0e0e14"/>
  <path d="M134 91 Q139 96 137 104" stroke="#2c2c3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M127 94 Q132 100 130 108" stroke="#2c2c3a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- feet -->
  <g fill="#e8b84b">
    <circle cx="68" cy="148" r="4.2"/><circle cx="74" cy="150" r="4.2"/><circle cx="80" cy="148" r="4.2"/>
    <circle cx="90" cy="148" r="4.2"/><circle cx="96" cy="150" r="4.2"/><circle cx="102" cy="148" r="4.2"/>
  </g>

  <!-- glints -->
  <g class="spark" stroke="#f5a524" stroke-width="4.5" stroke-linecap="round">
    <path d="M136 40 L145 30"/>
    <path d="M141 51 L154 48"/>
    <path d="M128 31 L130 19"/>
  </g>
</svg>
